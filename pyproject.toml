[project]
name = "weather-bot-services"
version = "0.1.0"
description = "Python services for a Telegram weather bot and operations dashboard"
requires-python = ">=3.13"
dependencies = [
    "asyncpg>=0.32.0",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "python-telegram-bot>=22.8",
    "uvicorn>=0.54.0",
]

[tool.uv]
package = false

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"
